<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnicería El Interior - Pedir Turno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="brand">
        <div class="logo-circle">C</div>
        <div>
          <h1>Carnicería El Interior</h1>
          <p>Rivadavia 123, Junín</p>
        </div>
      </div>
    </header>

    <main>
      <section class="booking">
        <div class="form-container">
          <h2>Reservar turno</h2>
          <form class="booking-form" id="bookingForm">
            <div class="form-group">
              <label><strong>Tu nombre</strong></label>
              <input type="text" name="name" placeholder="Completo" required />
            </div>

            <div class="form-group">
              <label><strong>Tu teléfono WhatsApp</strong></label>
              <input type="text" name="phone" placeholder="11 2345 6789" required />
            </div>

            <div class="form-group">
              <label><strong>¿Dónde vivís?</strong></label>
              <input type="text" name="location" placeholder="Junín, Bragado, etc." required />
            </div>

            <div class="form-group">
              <label><strong>Qué corte querés</strong></label>
              <select name="cut" required>
                <option value="">- Elegí -</option>
                <option value="asado">Asado</option>
                <option value="entraña">Entraña</option>
                <option value="vacío">Vacío</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label><strong>Día</strong></label>
                <input type="date" name="date" id="dateInput" required />
              </div>
              <div class="form-group">
                <label><strong>Hora</strong></label>
                <select name="time" id="timeSelect" required>
                  <option value="">- Elegí -</option>
                </select>
              </div>
            </div>

            <p class="availability-note" id="availabilityMessage"></p>

            <button type="submit" class="btn-submit">RESERVAR</button>
            <p class="note-small">Confirmamos por WhatsApp</p>
          </form>
        </div>

        <div class="saved-container">
          <h2>Mis turnos</h2>
          <div class="turnos-list" id="savedTurnos">
            <p class="no-data">Ninguno guardado</p>
          </div>

          <div class="calendar-section">
            <h3>Disponibilidad próximos días</h3>
            <div class="calendar-legend">
              <div class="legend-item">
                <span class="legend-box available"></span> Disponible
              </div>
              <div class="legend-item">
                <span class="legend-box limited"></span> Pocas horas
              </div>
              <div class="legend-item">
                <span class="legend-box full"></span> Lleno
              </div>
              <div class="legend-item">
                <span class="legend-box closed"></span> Cerrado
              </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><strong>Carnicería El Interior</strong></p>
      <p>WhatsApp: 11 2345 6789</p>
      <p>Abierto: Lun a Sab 8:00 - 19:00</p>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="script.js"></script>
</body>
</html>
